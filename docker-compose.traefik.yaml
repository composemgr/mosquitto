name: mosquitto
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: mosquitto-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '1883:1883'
    volumes:
      - './volumes/data/mosquitto:/mosquitto/data:z'
      - './volumes/config/mosquitto:/mosquitto/config:z'
      - './volumes/data/log/mosquitto:/mosquitto/log:z'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.mosquitto-app.entrypoints=http'
      - 'traefik.http.routers.mosquitto-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.mosquitto-app.middlewares=mosquitto-app-https-redirect'
      - 'traefik.http.middlewares.mosquitto-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.mosquitto-app-secure.entrypoints=https'
      - 'traefik.http.routers.mosquitto-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.mosquitto-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.mosquitto-app-secure.service=mosquitto-app'
      - 'traefik.http.services.mosquitto-app.loadbalancer.server.port=1883'
    networks:
      - mosquitto
      - traefik

networks:
  mosquitto:
    name: mosquitto
    external: false
  traefik:
    external: true
